<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Almaty Device — админка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F5F9; --card:#FFFFFF; --soft:#F0ECF4; --ink:#1E1036; --muted:#6B5D80; --line:#E4DDEA;
  --accent:#E0247F; --accent-ink:#FFFFFF; --ok:#0E9F84; --warn:#C77700; --bad:#D33A3A; --info:#3B6FD8;
  --font:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120A26; --card:#1D1238; --soft:#261848; --ink:#F5EEFA; --muted:#A797C2; --line:#33235A;
    --accent:#FF3D9A; --ok:#2FD6BE; --warn:#FFB547; --bad:#FF6B6B; --info:#7FA6FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120A26; --card:#1D1238; --soft:#261848; --ink:#F5EEFA; --muted:#A797C2; --line:#33235A;
  --accent:#FF3D9A; --ok:#2FD6BE; --warn:#FFB547; --bad:#FF6B6B; --info:#7FA6FF; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
.field{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.field{min-height:84px;resize:vertical}
label{display:grid;gap:5px;font-weight:600;font-size:13px;color:var(--muted)}
label > .field{font-weight:400;color:var(--ink);font-size:14px}
.btn{border:0;border-radius:10px;padding:9px 16px;min-height:40px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--ink);white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.muted{color:var(--muted)}
.err{color:var(--bad);min-height:1.2em;margin:6px 0 0}

/* вход */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(380px,100%);display:grid;gap:14px}
.login h1{margin:0;font-size:22px}
.logo b{color:var(--accent)}

/* каркас */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav.side .logo{font-weight:800;font-size:17px;padding:4px 10px 16px}
nav.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;border-radius:9px;padding:9px 10px;font-weight:600;cursor:pointer;color:var(--muted)}
nav.side button[aria-current="page"]{background:var(--soft);color:var(--ink)}
nav.side .count{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:0 7px;font-size:12px;min-width:20px;text-align:center}
nav.side .me{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line);display:grid;gap:8px}
main{padding:24px 28px 60px;min-width:0}
h2{margin:0 0 16px;font-size:22px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar .field{width:auto;min-width:180px}
.bar .grow{flex:1}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat small{color:var(--muted);font-weight:600}
.stat b{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}

.table{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--soft);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--soft)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{padding:32px;text-align:center;color:var(--muted)}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--soft);object-fit:contain;display:block}
.swatch{width:44px;height:44px;border-radius:8px;display:block}

.st{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--soft)}
.st.new,.st.paid{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.st.pending{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.st.contacted{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.st.shipped{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.st.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st.canceled{color:var(--muted)}
.off{opacity:.5}

/* модальное окно */
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,4,24,.5)}
dialog form{padding:22px;display:grid;gap:14px}
dialog h3{margin:0;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.actions .left{margin-right:auto}
.items{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.items div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.items div:last-child{border-bottom:0}
.paybox{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:13px}
.stat.click{cursor:pointer}
.stat.click:hover{border-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.imgbox{display:flex;gap:12px;align-items:center}
.imgbox img{width:84px;height:84px;object-fit:contain;border-radius:10px;background:var(--soft)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;margin-bottom:16px;max-width:760px}
.panel h3{margin:0;font-size:16px}
.setup-row{display:grid;grid-template-columns:1fr 160px;gap:10px}
.drow{display:grid;grid-template-columns:110px 1fr 130px;gap:10px;align-items:end;padding-top:12px;border-top:1px solid var(--line)}
.drow .span{grid-column:2 / -1}
.drow .check{min-height:40px}
@media (max-width:860px){.drow{grid-template-columns:1fr 1fr}.drow .check,.drow .span{grid-column:1 / -1}}
code{background:var(--soft);border-radius:5px;padding:1px 5px;font-size:12.5px}
.steps{margin:0;padding-left:20px;display:grid;gap:18px}
.steps li{padding-left:4px}
.steps li > div,.steps li > .tg-msg{margin-top:10px}
.tg-what{margin:0;padding:0;list-style:none;color:var(--muted);display:grid;gap:4px}
.tg-what b{color:var(--ink)}
.tg-msg{margin:0;font-size:13px;color:var(--muted)}
.tg-msg:empty{display:none}
.tg-msg.ok{color:var(--ok)}
.tg-msg.bad{color:var(--bad)}
.tg-chats{display:grid;gap:8px}
.tg-chats .check{padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600}
.tg-chats .check:has(input:checked){border-color:var(--accent)}
.tg-chats .check span{font-weight:400;color:var(--muted)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:860px){
  .app{grid-template-columns:1fr;align-content:start}
  nav.side{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:10px 12px;z-index:5;border-right:0;border-bottom:1px solid var(--line)}
  nav.side .logo,nav.side .me{display:none}
  nav.side button{flex:none}
  main{padding:16px}
  .stats{grid-template-columns:1fr 1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .bar .field{min-width:0;flex:1 1 140px}
  .hide-m{display:none}
}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form id="loginForm">
    <div class="logo">Almaty <b>Device</b></div>
    <h1>Вход в админку</h1>
    <label>Email<input class="field" name="email" type="email" autocomplete="username" required></label>
    <label>Пароль<input class="field" name="password" type="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr"></p>
    <button class="btn pri" type="submit">Войти</button>
  </form>
</div>

<div class="login" id="noconfig" hidden>
  <div class="panel" style="max-width:520px">
    <h3>База не подключена</h3>
    <p class="muted" style="margin:0">Впишите адрес проекта Supabase и публичный ключ в файл <code>config.js</code> в корне сайта. Инструкция в README.</p>
  </div>
</div>

<div class="app" id="app" hidden>
  <nav class="side" id="nav">
    <div class="logo">Almaty <b>Device</b></div>
    <button data-tab="orders">Заказы <span class="count" id="newCount" hidden></span></button>
    <button data-tab="customers">Клиенты</button>
    <button data-tab="products">Товары</button>
    <button data-tab="categories">Категории</button>
    <button data-tab="settings">Настройки сайта</button>
    <button data-tab="telegram">Telegram</button>
    <button data-tab="staff">Сотрудники</button>
    <div class="me"><span id="meEmail"></span><a href="../" target="_blank">Открыть сайт ↗</a><button class="btn sm" id="logout">Выйти</button></div>
  </nav>
  <main id="main"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script src="../config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const CFG = window.AD_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Math.round(n || 0).toLocaleString("ru-RU") + " ₸";
const dt = s => new Date(s).toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
const phoneFmt = p => { const d = String(p||"").replace(/\D/g,""); return d.length === 11 ? `+${d[0]} ${d.slice(1,4)} ${d.slice(4,7)} ${d.slice(7,9)} ${d.slice(9)}` : "+" + d; };
const STATUS = {paid:"Оплачен · к отгрузке", shipped:"Отправлен", done:"Доставлен", pending:"Ждёт оплаты", new:"Новая заявка", contacted:"Связались", canceled:"Отменён"};
const ORDER_STATUSES = ["pending","paid","shipped","done","canceled"], PRE_STATUSES = ["new","contacted","done","canceled"];
const stBadge = s => `<span class="st ${s}">${STATUS[s] || s}</span>`;
let tt; function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 2400); }
const fail = e => { console.error(e); toast("Ошибка: " + (e.message || e)); };

if(!CFG.supabaseUrl || !CFG.supabaseKey){ $("#noconfig").hidden = false; throw new Error("no config"); }
const sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
let ME = null, ROLE = null, TAB = "orders";
let CATS = [], PRODUCTS = [];

/* ───────── вход ───────── */
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector("button"); btn.disabled = true; $("#loginErr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
  btn.disabled = false;
  if(error) $("#loginErr").textContent = error.message === "Invalid login credentials" ? "Неверный email или пароль" : error.message;
};
$("#logout").onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((_ev, session) => { setTimeout(() => boot(session), 0); });

async function boot(session){
  if(!session){ ME = null; $("#app").hidden = true; $("#login").hidden = false; return; }
  if(ME && ME.id === session.user.id) return;
  ME = session.user;
  const { data } = await sb.from("staff").select("role").eq("user_id", ME.id).maybeSingle();
  if(!data){
    $("#loginErr").textContent = "У этого пользователя нет доступа к админке. Попросите администратора добавить вас.";
    ME = null; await sb.auth.signOut(); return;
  }
  ROLE = data.role;
  $("#meEmail").textContent = `${ME.email} · ${ROLE === "admin" ? "админ" : "менеджер"}`;
  $("#login").hidden = true; $("#app").hidden = false;
  document.querySelectorAll('[data-tab="staff"],[data-tab="telegram"]').forEach(b => b.hidden = ROLE !== "admin");
  const h = location.hash.slice(1); show(h && TABS[h] ? h : "orders");
  refreshNewCount();
  sb.channel("orders")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"orders"}, p => {
      if(p.new.kind === "preorder") toast(`Новая заявка на предзаказ №${p.new.id}`);
      else if(p.new.status === "pending") toast(`Новый заказ №${p.new.id} — ждёт оплаты`);
      refreshNewCount(); if(TAB === "orders") TABS.orders();
    })
    .on("postgres_changes", {event:"UPDATE", schema:"public", table:"orders"}, p => {
      if(p.new.status === "paid" && p.new.paid_at && Date.now() - new Date(p.new.paid_at) < 60000) toast(`Оплачен заказ №${p.new.id} — к отгрузке`);
      refreshNewCount(); if(TAB === "orders" && !$("#dlg").open) TABS.orders();
    }).subscribe();
}
async function refreshNewCount(){
  const { count } = await sb.from("orders").select("id", {count:"exact", head:true}).in("status", ["paid","new"]);
  $("#newCount").hidden = !count; $("#newCount").textContent = count || "";
}

/* ───────── навигация ───────── */
document.querySelectorAll("#nav [data-tab]").forEach(b => b.onclick = () => show(b.dataset.tab));
function show(tab){
  TAB = tab; history.replaceState(null, "", "#" + tab);
  document.querySelectorAll("#nav [data-tab]").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  $("#main").innerHTML = `<p class="muted">Загрузка…</p>`;
  TABS[tab]().catch(fail);
}
async function loadCatalog(){
  const [c, p] = await Promise.all([
    sb.from("categories").select("*").order("sort"),
    sb.from("products").select("*").order("cat").order("pop", {ascending:false})
  ]);
  if(c.error) throw c.error; if(p.error) throw p.error;
  CATS = c.data; PRODUCTS = p.data;
}
function openDialog(html, onSubmit){
  const d = $("#dlg"), f = $("#dlgForm");
  f.innerHTML = html;
  f.onsubmit = async e => {
    const sub = e.submitter && e.submitter.value;
    if(sub === "cancel") return;
    e.preventDefault();
    const btns = f.querySelectorAll("button"); btns.forEach(b => b.disabled = true);
    try{ const close = await onSubmit(sub, f); if(close !== false) d.close(); }
    catch(err){ fail(err); }
    finally{ btns.forEach(b => b.disabled = false); }
  };
  d.showModal();
  return f;
}

const TABS = {};

/* ───────── заказы ───────── */
const OF = {status:"active", q:"", period:"30"};
const FILTERS = {active:"В работе", ship:"К отгрузке", pending:"Ждут оплаты", pre:"Заявки на предзаказ", all:"Все", done:"Доставлены", canceled:"Отменённые"};
const deliveryLine = o => [o.delivery_name, o.city, o.address].filter(Boolean).join(", ");
TABS.orders = async () => {
  sb.rpc("expire_pending").then(() => {});
  let q = sb.from("orders").select("*").order("created_at", {ascending:false}).limit(500);
  if(OF.period !== "all") q = q.gte("created_at", new Date(Date.now() - OF.period * 864e5).toISOString());
  const { data, error } = await q; if(error) throw error;
  const paid = data.filter(o => ["paid","shipped","done"].includes(o.status));
  const revenue = paid.reduce((s,o) => s + o.total, 0);
  let list = data;
  const f = OF.status;
  if(f === "active") list = list.filter(o => ["paid","shipped","new","contacted"].includes(o.status));
  else if(f === "ship") list = list.filter(o => o.status === "paid");
  else if(f === "pending") list = list.filter(o => o.status === "pending");
  else if(f === "pre") list = list.filter(o => o.kind === "preorder");
  else if(f !== "all") list = list.filter(o => o.status === f);
  if(f === "ship") list = [...list].reverse();   // к отгрузке — сначала самые старые оплаты
  if(OF.q){ const s = OF.q.toLowerCase(), d = s.replace(/\D/g,""); list = list.filter(o => String(o.id) === s.replace("№","") || o.name.toLowerCase().includes(s) || (d && o.phone.includes(d))); }
  const period = {"1":"сегодня","7":"за 7 дней","30":"за 30 дней","all":"за всё время"}[OF.period];
  const pendingN = data.filter(o => o.status === "pending").length;
  $("#main").innerHTML = `
    <h2>Заказы</h2>
    <div class="stats">
      <div class="stat click" data-f="ship"><small>К отгрузке</small><b>${data.filter(o => o.status === "paid").length}</b></div>
      <div class="stat click" data-f="pending"><small>Ждут оплаты</small><b>${pendingN}</b></div>
      <div class="stat"><small>Выручка ${period}</small><b>${fmt(revenue)}</b></div>
      <div class="stat"><small>Оплаченных заказов · средний чек</small><b>${paid.length} · ${fmt(paid.length ? revenue / paid.length : 0)}</b></div>
    </div>
    <div class="bar">
      <input class="field grow" id="oq" type="search" placeholder="Номер, имя или телефон" value="${esc(OF.q)}">
      <select class="field" id="os">${Object.entries(FILTERS).map(([k,v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      <select class="field" id="op"><option value="1">Сегодня</option><option value="7">7 дней</option><option value="30">30 дней</option><option value="all">Всё время</option></select>
      <button class="btn" id="oexp">Скачать CSV</button>
    </div>
    ${f === "pending" ? `<p class="muted" style="margin:-4px 0 14px">Покупатель оформил заказ, но ещё не оплатил. Через 24 часа без оплаты заказ отменяется сам. Если клиент оплатил переводом, откройте заказ и нажмите «Подтвердить оплату».</p>` : ""}
    <div class="table"><table>
      <thead><tr><th>№</th><th class="hide-m">Дата</th><th>Клиент</th><th class="hide-m">Состав</th><th class="hide-m">Доставка</th><th class="num">Сумма</th><th>Статус</th></tr></thead>
      <tbody>${list.map(o => `
        <tr class="click" data-id="${o.id}">
          <td><b>${o.id}</b></td><td class="muted hide-m">${dt(o.created_at)}</td>
          <td>${esc(o.name)}<br><span class="muted">${phoneFmt(o.phone)}</span></td>
          <td class="hide-m">${o.kind === "preorder" ? `<i>Предзаказ:</i> ${esc(o.request)}` : o.items.map(i => `${esc(i.name)} × ${i.qty}`).join("<br>")}</td>
          <td class="hide-m muted">${esc(deliveryLine(o)) || "—"}</td>
          <td class="num">${o.kind === "preorder" ? "—" : fmt(o.total)}</td><td>${stBadge(o.status)}</td>
        </tr>`).join("")}</tbody>
    </table>${list.length ? "" : `<div class="empty">${f === "ship" ? "Нечего отгружать — все оплаченные заказы отправлены" : "Заказов нет"}</div>`}</div>`;
  $("#os").value = OF.status; $("#op").value = OF.period;
  document.querySelectorAll(".stat[data-f]").forEach(el => el.onclick = () => { OF.status = el.dataset.f; TABS.orders(); });
  $("#oq").oninput = e => { OF.q = e.target.value.trim(); clearTimeout(OF.t); OF.t = setTimeout(() => TABS.orders().then(() => { const i = $("#oq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }), 250); };
  $("#os").onchange = e => { OF.status = e.target.value; TABS.orders(); };
  $("#op").onchange = e => { OF.period = e.target.value; TABS.orders(); };
  $("#oexp").onclick = () => csv(`orders-${new Date().toISOString().slice(0,10)}.csv`,

      ${o.delivery_name ? `<div><span>${esc(o.delivery_name)}</span><span>${o.delivery_cost ? fmt(o.delivery_cost) : "бесплатно"}</span></div>` : ""}

    ${o.comment ? `<div><span class="muted">Комментарий покупателя:</span> ${esc(o.comment)}</div>` : ""}

      <button class="btn" value="cancel" formnovalidate>Закрыть</button>
      <button class="btn pri" value="save">Сохранить</button>
    </div>`, async (act, f) => {
      if(act === "delete"){
        if(!confirm(`Удалить заказ №${o.id} без возможности восстановления?`)) return false;
        const { error } = await sb.from("orders").delete().eq("id", o.id); if(error) throw error; toast("Заказ удалён");
      } else if(act === "confirm"){

        const r = await sb.rpc("confirm_payment", {p_id: o.id, p_provider: "manual"}); if(r.error) throw r.error;
        if(f.note.value !== o.manager_note){ const u = await sb.from("orders").update({manager_note: f.note.value}).eq("id", o.id); if(u.error) throw u.error; }

      } else {

        if(!pre && f.status.value === "paid" && !["paid","shipped","done"].includes(o.status)){
          if(!confirm(`Подтвердить оплату заказа №${o.id} на ${fmt(o.total)}?`)) return false;

        } else {
          const { error } = await sb.from("orders").update({status: f.status.value, manager_note: f.note.value}).eq("id", o.id); if(error) throw error;
        }
        toast("Сохранено");
      }
      refreshNewCount(); TABS.orders();

function csv(name, rows){
  const s = "﻿" + rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([s], {type:"text/csv"})); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

          <label>Скидка, %<input class="field" name="percent" type="number" min="0" max="90" value="${pr.percent ?? 10}"></label>
          <label>Действует до (время Алматы)<input class="field" name="until" type="datetime-local" value="${toLocal(pr.until)}"></label>
        </div>
        <label>Как писать дату окончания на сайте<input class="field" name="untilText" value="${esc(pr.untilText)}" placeholder="22 ноября"></label>
      </div>
      <div class="panel"><h3>Подборка «Сетап к релизу»</h3>
        ${[0,1,2,3].map(i => `<div class="setup-row"><select class="field" name="sp${i}"><option value="">— не показывать —</option>${opts((setup[i]||{}).id)}</select><input class="field" name="sr${i}" value="${esc((setup[i]||{}).role)}" placeholder="Подпись: Звук, Мышь…"></div>`).join("")}
      </div>
      <div class="panel"><h3>Доставка</h3>
        <p class="muted" style="margin:0">Цена доставки прибавляется к заказу. От суммы «бесплатная доставка от» (после скидки) любая доставка бесплатна.</p>
        ${(s.delivery || []).map((d, i) => `<div class="drow">
          <label class="check"><input type="checkbox" name="de${i}" ${d.enabled !== false ? "checked" : ""}> Включена</label>
          <label>Название<input class="field" name="dn${i}" value="${esc(d.name)}"></label>
          <label>Цена, ₸<input class="field" name="dp${i}" type="number" min="0" step="100" value="${+d.price || 0}"></label>
          <label class="span">Пояснение для покупателя<input class="field" name="dt${i}" value="${esc(d.note)}"></label></div>`).join("")}
      </div>
      <div class="panel"><h3>Оплата</h3>
        <label>Способ приёма оплаты<select class="field" name="pmode">
          <option value="manual">Вручную: менеджер присылает счёт Kaspi и подтверждает оплату в админке</option>
          <option value="bank" disabled>Онлайн через банк — появится после подключения платёжной системы</option>
        </select></label>
        <label>Что увидит покупатель после оформления<textarea class="field" name="ptext">${esc((s.payment || {}).manual_text)}</textarea></label>
      </div>
      <div class="panel"><h3>Прочее</h3>
        <label class="check"><input type="checkbox" name="demo_note" ${s.demo_note !== false ? "checked" : ""}> Показывать в каталоге строку «Товары и цены — примеры»</label>
      </div>
      <div class="actions" style="max-width:760px"><button class="btn pri">Сохранить и опубликовать</button></div>
    </form>`;
  $("#sf").onsubmit = async e => {
    e.preventDefault(); const f = e.target, btn = f.querySelector("button"); btn.disabled = true;
    const code = f.code.value.trim().toUpperCase();
    const next = {...s,
      wa: f.wa.value.replace(/\D/g,""), free_from: +f.free_from.value || 0, release: fromLocal(f.release.value) || s.release,
      promo: code ? {code, percent: +f.percent.value || 0, until: fromLocal(f.until.value) || new Date(Date.now() + 7*864e5).toISOString(), untilText: f.untilText.value.trim()} : null,
      setup: [0,1,2,3].map(i => ({id: f["sp"+i].value, role: f["sr"+i].value.trim()})).filter(x => x.id),
      delivery: (s.delivery || []).map((d, i) => ({...d, enabled: f["de"+i].checked, name: f["dn"+i].value.trim() || d.name, price: +f["dp"+i].value || 0, note: f["dt"+i].value.trim()})),
      payment: {...(s.payment || {}), mode: f.pmode.value, manual_text: f.ptext.value.trim()},
      demo_note: f.demo_note.checked};
    const { error } = await sb.from("site_settings").upsert({id:1, data:next});
    btn.disabled = false;
    if(error) return fail(error);
    toast("Сохранено. Сайт обновится при следующей загрузке страницы");
  };
};

/* ───────── Telegram ───────── */
// Токен бота уходит только в сам Telegram (проверка и поиск чата) и в закрытую часть базы.
async function tgApi(token, method){
  let r;
  try{ r = await fetch(`https://api.telegram.org/bot${token}/${method}`); }
  catch(e){ throw new Error("Нет связи с Telegram — проверьте интернет и попробуйте ещё раз"); }
  const j = await r.json().catch(() => ({}));
  if(j.ok) return j.result;
  if(r.status === 401 || r.status === 404) throw new Error("Telegram не узнал токен — скопируйте его из @BotFather целиком");
  if(r.status === 409) throw new Error("Этот бот уже подключён к другому сервису — создайте для уведомлений отдельного бота");
  throw new Error(j.description || "Telegram ответил ошибкой " + r.status);
}
const TG_TYPES = {private:"личный чат", group:"группа", supergroup:"группа", channel:"канал"};
const tgTitle = c => c.title || [c.first_name, c.last_name].filter(Boolean).join(" ") || (c.username ? "@" + c.username : String(c.id));
function tgChats(updates){
  const chats = new Map(), gone = new Set();
  for(const u of updates) for(const v of Object.values(u)){
    const c = v && v.chat; if(!c) continue;
    chats.set(c.id, c);
    if(v.migrate_to_chat_id || ["left","kicked"].includes(v.new_chat_member?.status)) gone.add(c.id); else gone.delete(c.id);
  }
  return [...chats.values()].filter(c => !gone.has(c.id));
}
async function tgRunTest(){
  const out = $("#tgTestRes"), btn = $("#tgTest");
  btn.disabled = true; out.className = "tg-msg"; out.textContent = "Отправляем тестовое сообщение…";
  try{
    const { data: id, error } = await sb.rpc("telegram_test"); if(error) throw error;
    let r = null;
    try{
      for(let i = 0; i < 10 && !r; i++){
        await new Promise(ok => setTimeout(ok, 700));
        const res = await sb.rpc("telegram_test_result", {p_id: id}); if(res.error) throw res.error; r = res.data;
      }
    }catch(e){ console.warn(e); }
    if(!r){ out.textContent = "Сообщение отправлено — проверьте Telegram. Если не пришло за минуту, подключите чат заново."; return; }
    if(r.status === 200){ out.className = "tg-msg ok"; out.textContent = "✓ Тестовое сообщение доставлено — проверьте Telegram"; return; }
    let d = ""; try{ d = JSON.parse(r.content).description || ""; }catch(e){}
    out.className = "tg-msg bad";
    out.textContent = /chat not found|blocked|kicked|not a member|deactivated/i.test(d)
      ? "Telegram не доставил сообщение: бот не может писать в этот чат. Напишите боту /start (или верните его в группу) и подключите чат заново."
      : `Telegram не доставил сообщение: ${d || r.error || "ошибка " + r.status}`;
  }catch(e){ out.className = "tg-msg bad"; out.textContent = "Ошибка: " + (e.message || e); }
  finally{ btn.disabled = false; }
}
TABS.telegram = async () => {
  if(ROLE !== "admin"){ $("#main").innerHTML = `<p class="muted">Раздел доступен только администратору.</p>`; return; }
  const { data: st, error } = await sb.rpc("telegram_status");
  if(error){
    if(error.code === "PGRST202" || /telegram_status/.test(error.message || "")){
      $("#main").innerHTML = `<h2>Уведомления в Telegram</h2><div class="panel"><p class="muted" style="margin:0">Сначала обновите базу: выполните файл <code>supabase/schema.sql</code> в Supabase → SQL Editor.</p></div>`;
      return;
    }
    throw error;
  }
  $("#main").innerHTML = `
    <h2>Уведомления в Telegram</h2>
    <div class="panel">
      <p style="margin:0">${st.connected
        ? `<span class="st done">Подключено</span>&nbsp; Уведомления приходят в «${esc(st.chat_title)}»${st.bot ? ` от бота @${esc(st.bot)}` : ""}.`
        : `<span class="st">Не подключено</span>&nbsp; Подключите бота, и заказы будут приходить вам в Telegram.`}</p>
      <ul class="tg-what">
        <li>🕓 <b>новый заказ</b> ждёт оплаты — пока оплата подтверждается вручную, клиенту нужно отправить счёт;</li>
        <li>✅ <b>заказ оплачен</b> — можно отгружать: состав, сумма, доставка и адрес;</li>
        <li>🆕 <b>заявка на предзаказ</b>.</li>
      </ul>
      ${st.connected ? `<div class="actions" style="justify-content:flex-start">
        <button class="btn" id="tgTest">Отправить тестовое сообщение</button>
        <button class="btn" id="tgChange">Подключить другой чат</button>
        <button class="btn danger" id="tgOff">Отключить</button></div>
      <p class="tg-msg" id="tgTestRes"></p>` : ""}
    </div>
    <form class="panel" id="tgf" ${st.connected ? "hidden" : ""}>
      <h3>Подключение за 3 шага</h3>
      <ol class="steps">
        <li><b>Создайте бота.</b> В Telegram откройте <a href="https://t.me/BotFather" target="_blank" rel="noopener">@BotFather</a>, отправьте <code>/newbot</code>, придумайте имя и адрес бота (адрес должен заканчиваться на <code>bot</code>). BotFather пришлёт токен — строку вида <code>123456789:AAH…</code>. Вставьте её сюда:
          <div class="setup-row"><input class="field" name="token" autocomplete="off" spellcheck="false" placeholder="123456789:AAH…" required><button class="btn" type="button" id="tgCheck">Проверить</button></div>
          <p class="tg-msg" id="tgBot"></p></li>
        <li><b>Напишите боту.</b> Откройте своего бота и нажмите «Запустить». Чтобы уведомления видели несколько человек, создайте группу, добавьте в неё бота и напишите там любое сообщение. Потом нажмите:
          <div><button class="btn" type="button" id="tgFind">Найти чат</button></div>
          <p class="tg-msg" id="tgFindMsg"></p>
          <div class="tg-chats" id="tgChats"></div></li>
        <li><b>Подключите.</b> В выбранный чат придёт тестовое сообщение.
          <div><button class="btn pri" id="tgSave" disabled>Подключить</button></div></li>
      </ol>
      <p class="muted" style="margin:0">Токен хранится в закрытой части базы: после подключения его не видно ни на сайте, ни в админке.</p>
    </form>`;

  const f = $("#tgf"); let bot = null;
  const say = (el, text, cls = "") => { el.className = "tg-msg " + cls; el.textContent = text; };
  const token = () => f.token.value.trim();
  async function checkBot(){
    if(!token()){ f.token.focus(); throw new Error("Сначала вставьте токен бота"); }
    const me = await tgApi(token(), "getMe"); bot = me.username;
    $("#tgBot").className = "tg-msg ok";
    $("#tgBot").innerHTML = `✓ Бот @${esc(bot)} найден — <a href="https://t.me/${encodeURIComponent(bot)}" target="_blank" rel="noopener">открыть его в Telegram</a>`;
  }
  f.token.oninput = () => { bot = null; $("#tgBot").textContent = ""; $("#tgChats").innerHTML = ""; $("#tgFindMsg").textContent = ""; $("#tgSave").disabled = true; };
  $("#tgCheck").onclick = async () => { try{ await checkBot(); }catch(e){ say($("#tgBot"), e.message, "bad"); } };
  $("#tgFind").onclick = async () => {
    const btn = $("#tgFind"), msg = $("#tgFindMsg"); btn.disabled = true; $("#tgChats").innerHTML = ""; $("#tgSave").disabled = true;
    try{
      if(!bot) await checkBot();
      say(msg, "Ищем чаты…");
      const chats = tgChats(await tgApi(token(), "getUpdates"));
      if(!chats.length){ say(msg, `Боту пока никто не писал. Откройте @${bot}, нажмите «Запустить» и нажмите «Найти чат» ещё раз.`, "bad"); return; }
      say(msg, chats.length > 1 ? "Выберите, куда присылать уведомления:" : "");
      $("#tgChats").innerHTML = chats.map(c => `<label class="check"><input type="radio" name="chat" value="${c.id}" data-title="${esc(tgTitle(c))}" ${chats.length === 1 ? "checked" : ""}> ${esc(tgTitle(c))} <span>· ${TG_TYPES[c.type] || c.type}</span></label>`).join("");
      $("#tgSave").disabled = !f.querySelector("[name=chat]:checked");
      f.querySelectorAll("[name=chat]").forEach(r => r.onchange = () => $("#tgSave").disabled = false);
    }catch(e){ say(msg, e.message, "bad"); }
    finally{ btn.disabled = false; }
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const chat = f.querySelector("[name=chat]:checked"); if(!chat) return;
    const btn = $("#tgSave"); btn.disabled = true;
    const { error } = await sb.rpc("set_telegram", {p_token: token(), p_chat_id: chat.value, p_chat_title: chat.dataset.title, p_bot: bot});
    if(error){ btn.disabled = false; return fail(error); }
    await TABS.telegram(); tgRunTest();
  };
  if(st.connected){
    $("#tgTest").onclick = tgRunTest;
    $("#tgChange").onclick = () => { f.hidden = false; f.token.focus(); f.scrollIntoView({behavior:"smooth", block:"start"}); };
    $("#tgOff").onclick = async () => {
      if(!confirm("Отключить уведомления в Telegram?")) return;
      const { error } = await sb.rpc("set_telegram", {p_token: null, p_chat_id: null}); if(error) return fail(error);
      toast("Уведомления отключены"); TABS.telegram();
    };
  }
};

  const { data, error } = await sb.from("staff").select("*").order("created_at"); if(error) throw error;
  $("#main").innerHTML = `
    <h2>Сотрудники</h2>
    <div class="panel">
      <p class="muted" style="margin:0"><b>Менеджер</b> работает с заказами, клиентами, товарами и настройками. <b>Админ</b> ещё добавляет сотрудников и удаляет заказы.</p>
      <div class="table"><table><thead><tr><th>Email</th><th>Роль</th><th></th></tr></thead><tbody>
        ${data.map(x => `<tr><td>${esc(x.email)}</td><td>${x.role === "admin" ? "Админ" : "Менеджер"}</td><td class="num">${x.user_id === ME.id ? `<span class="muted">это вы</span>` : `<button class="btn sm danger" data-rm="${x.user_id}">Убрать доступ</button>`}</td></tr>`).join("")}
      </tbody></table></div>
    </div>
    <form class="panel" id="stf"><h3>Добавить сотрудника</h3>
      <p class="muted" style="margin:0">Сначала создайте пользователя в Supabase: <b>Authentication → Users → Add user</b> (email и пароль). Потом добавьте его здесь.</p>
      <div class="setup-row"><input class="field" name="email" type="email" required placeholder="email сотрудника"><select class="field" name="role"><option value="manager">Менеджер</option><option value="admin">Админ</option></select></div>
      <div class="actions"><button class="btn pri">Дать доступ</button></div>
    </form>`;
  $("#stf").onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const { error } = await sb.rpc("add_staff", {p_email: f.email.value, p_role: f.role.value});
    if(error) return toast(error.message); toast("Доступ выдан"); TABS.staff();
  };
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if(!confirm("Убрать доступ к админке?")) return;
    const { error } = await sb.from("staff").delete().eq("user_id", b.dataset.rm); if(error) return fail(error); toast("Доступ убран"); TABS.staff();
  });
};
